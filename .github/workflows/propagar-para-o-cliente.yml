name: Propagar para o cliente

# Este pacote não publica em lugar nenhum: quem o consome é o stoat-web-dev,
# pelo ponteiro do submódulo `packages/stoat.js`. Enquanto esse ponteiro não
# avança, um merge aqui não chega a ninguém — é o equivalente ao deploy dos
# outros repositórios, e era feito à mão.
#
# Ao entrar código na main, abre lá um PR avançando o ponteiro para a nova
# ponta. Quem revisa continua sendo gente: o PR não é mergeado sozinho, porque
# a CI do cliente é que dirá se o cliente ainda compila com a mudança.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: propagar-cliente
  cancel-in-progress: false

env:
  CLIENTE: Oficina-Simas-Production-S-A/stoat-web-dev
  BRANCH: chore/atualiza-submodulo-stoat-js

jobs:
  abrir-pr-no-cliente:
    name: Avançar o ponteiro do submódulo
    runs-on: ubuntu-latest
    steps:
      # O GITHUB_TOKEN desta execução só alcança este repositório, e o cliente é
      # privado. Sem um PAT o passo não tem como agir — avisa e sai verde, em
      # vez de marcar vermelho por uma configuração ausente.
      - name: Verificar credencial
        id: credencial
        env:
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Propagação manual::Sem o secret AUTOMATION_TOKEN, o ponteiro do submódulo precisa ser avançado à mão no ${CLIENTE}."
            {
              echo "### Propagação não automatizada"
              echo
              echo "Falta o secret \`AUTOMATION_TOKEN\` (PAT com escopo \`repo\`)."
              echo
              echo "Enquanto isso, no \`stoat-web-dev\`:"
              echo
              echo '```sh'
              echo "git switch -c ${BRANCH}"
              echo "git submodule update --remote packages/stoat.js"
              echo "git add packages/stoat.js && git commit -m 'chore: avanca o submodulo stoat.js'"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "disponivel=true" >> "$GITHUB_OUTPUT"

      - name: Clonar o cliente
        if: steps.credencial.outputs.disponivel == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${CLIENTE}.git" cliente

      - name: Avançar o ponteiro e abrir o PR
        if: steps.credencial.outputs.disponivel == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd cliente

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          atual=$(git ls-tree HEAD packages/stoat.js --format='%(objectname)')
          if [ "${atual}" = "${SHA}" ]; then
            echo "O cliente já aponta para ${SHA::8}. Nada a fazer."
            exit 0
          fi

          git switch -c "${BRANCH}"

          # Reescreve o gitlink direto no índice. Clonar o submódulo só para
          # dar checkout num commit e voltar seria trabalho à toa: o ponteiro é
          # literalmente o SHA, e é só isso que precisa mudar.
          git update-index --add --cacheinfo "160000,${SHA},packages/stoat.js"

          git commit -m "chore: avanca o submodulo stoat.js para ${SHA::8}

          Traz para o cliente o que entrou na main do SDK:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}"

          # Push forçado numa branch de nome fixo: mantém um único PR vivo, que
          # vai acumulando as atualizações até alguém mergear.
          git push --force origin "${BRANCH}"

          existente=$(gh pr list --repo "${CLIENTE}" \
            --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')

          if [ -n "${existente}" ]; then
            echo "PR #${existente} já está aberto no cliente; foi atualizado com ${SHA::8}."
            echo "PR do cliente atualizado: #${existente}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "Avança o ponteiro do submódulo \`packages/stoat.js\` para a ponta atual da main do SDK."
            echo
            echo "Aberto automaticamente pelo workflow **Propagar para o cliente**, do \`javascript-client-sdk\`."
            echo
            echo "A CI daqui é quem diz se o cliente ainda compila com a mudança."
          } > body.md

          gh pr create --repo "${CLIENTE}" \
            --base develop \
            --head "${BRANCH}" \
            --title "chore: avanca o submodulo stoat.js" \
            --body-file body.md
